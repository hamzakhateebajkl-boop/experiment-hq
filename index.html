<title>Experiment Events HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
<style>
/* Deliberately single-theme: a white-paper sketch world with Experiment red. Every surface painted explicitly. */
:root{
  --paper:#F2F1ED; --card:#FFFFFF; --hover:#EFEEEA; --ink:#37352F; --muted:#55524C; --faint:#6F6C67; --line:#E6E5E1; --line-2:#D9D8D3;
  --red:#D3302A; --red-soft:#FBE7E5;
  --tag-gray-bg:#E9E8E4; --tag-green-bg:#DBEDDB; --tag-green:#1C3829; --tag-yellow-bg:#FDECC8; --tag-yellow:#402C1B; --tag-blue-bg:#D3E5EF; --tag-blue:#183347;
  --shadow:0 1px 2px rgba(15,15,15,.08), 0 6px 20px rgba(15,15,15,.12);
}
*{box-sizing:border-box}
:root{--rail-w:308px;--peek-w:0px}
body.peek-open{--peek-w:332px}
@media (max-width:700px){body.peek-open{--peek-w:0px}}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.hidden{display:none!important}
.ni{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2.5px;flex:none}


/* ---------- full-screen stage ---------- */
.stage{position:fixed;inset:0;right:var(--rail-w);left:var(--peek-w);transition:left .18s ease;display:grid;place-items:center;background:var(--paper);background-image:radial-gradient(rgba(55,53,47,.16) 1.3px, transparent 1.3px);background-size:26px 26px}
svg#office{width:100%;height:100%;font-family:"Inter",sans-serif}
.seat{cursor:pointer}
.chip-l{font-family:"Caveat",cursive;font-size:15.5px;font-weight:600;fill:var(--ink)}
.chipbg{fill:#FFFFFF;stroke:var(--line-2);stroke-width:1.1;rx:8}
.seat:hover .chipbg,.seat.selected .chipbg{stroke:var(--red);stroke-width:1.6}
.seat.off .chip-l{fill:var(--faint)}
.char .bob{transform-box:fill-box;transform-origin:50% 100%}
.seat.working .char .bob{animation:type 1.1s ease-in-out infinite}
.seat.away .char{opacity:.55}
.seat.off .char{opacity:.34}
.glow{animation:pulse 2.6s ease-in-out infinite}
.walker .bob{animation:walk .45s ease-in-out infinite}
.walker.idle .bob{animation:none}
.steam path{stroke:#B9B7B0;stroke-width:1.6;fill:none;stroke-linecap:round;opacity:0;animation:steam 3s ease-out infinite}
.steam path:nth-child(2){animation-delay:1s}
.steam path:nth-child(3){animation-delay:2s}
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.42}}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}30%{opacity:.55}100%{opacity:0;transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.seat.working .char .bob,.walker .bob,.glow,.steam path{animation:none}}

/* ---------- floating HUD ---------- */
.hud{position:fixed;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud-tl{top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(var(--peek-w) + 16px);transition:left .18s ease}
.hud-tr{top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(var(--rail-w) + 16px);justify-content:flex-end;max-width:70vw}
.hud-bl{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:calc(var(--peek-w) + 16px);transition:left .18s ease}
.hud-br{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:calc(var(--rail-w) + 16px);justify-content:flex-end}
/* ---------- always-on projects rail ---------- */
.rail{position:fixed;top:0;right:0;bottom:0;width:var(--rail-w);background:var(--card);border-left:1px solid var(--line);box-shadow:-4px 0 18px rgba(15,15,15,.06);display:flex;flex-direction:column;z-index:12;padding-top:env(safe-area-inset-top,0px)}
.rail-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.rail-head b{font-size:14px}
.rail-head .tiny{margin-left:2px}
.rail-body{overflow:auto;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:8px;flex:1}
.pcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card);cursor:pointer;text-align:left;width:100%;display:block}
.pcard:hover{border-color:var(--red)}
.pcard:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.pcard b{font-size:13px;overflow-wrap:anywhere}
.pcard .bar{width:auto;flex:1}
.pcard.done-p{opacity:.55}
@media (max-width:1080px){ :root{--rail-w:0px} .rail{display:none} .hud-tr{max-width:96vw} }
.brand{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 18px;display:flex;align-items:center;gap:14px}
.brand img{height:44px;width:auto;display:block}
.brand small{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;text-transform:uppercase}
@media (max-width:700px){.brand img{height:30px}.brand{padding:8px 12px}}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;box-shadow:var(--shadow);white-space:nowrap}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill.live .d{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.pill.btnish{cursor:pointer}
.pill.btnish:hover{background:var(--hover)}
.legend{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:11px;color:var(--muted);box-shadow:var(--shadow)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:6px;padding:5px 10px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 1px rgba(15,15,15,.05);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seat:focus-visible,.pill.btnish:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:none}
.btn.primary:hover{filter:brightness(1.06);background:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px;min-height:26px}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;box-shadow:var(--shadow);font-size:12px}
.me-chip b{font-weight:600}
.me-chip span{color:var(--faint)}
.sk-av{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:"Caveat",cursive;font-weight:600;font-size:17px;background:#fff;flex:none;position:relative;color:var(--ink)}
.sk-av.sm{width:24px;height:24px;font-size:13px;border-width:1.2px}
.sk-av .b{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid #fff}

/* ---------- floating person card ---------- */
.float-card{position:fixed;z-index:20;top:0;bottom:0;left:0;width:332px;overflow:auto;background:var(--card);border-right:1px solid var(--line);box-shadow:4px 0 18px rgba(15,15,15,.07);padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px}
@media (max-width:700px){.float-card{top:auto;left:0;right:0;width:auto;max-height:62vh;border-right:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding-top:12px}}
.float-card h2.title{font-size:19px;display:flex;align-items:center;gap:10px;padding-right:26px}
.float-card h2.title select{border:1px solid transparent;background:transparent;font-weight:700;font-size:18px;padding:2px 4px;border-radius:6px;cursor:pointer;flex:1;min-width:0;width:auto}
.float-card h2.title select:hover{border-color:var(--line-2);background:var(--card)}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:12px;width:min(330px,90vw);text-align:center;align-items:center}
.gate-card h2{font-size:18px}
.gate-card form{display:flex;gap:8px;width:100%}
.gate-card input{flex:1;text-align:center}
.card-x{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;min-width:28px;min-height:28px;border-radius:4px}
.card-x:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.card-x:hover{background:var(--hover);color:var(--ink)}
.props{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:13px;align-items:center}
.props .k{color:var(--muted);padding:2px 0}
.props .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:500;background:var(--tag-gray-bg);color:var(--ink);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.green{background:var(--tag-green-bg);color:var(--tag-green)} .tag.yellow{background:var(--tag-yellow-bg);color:var(--tag-yellow)} .tag.blue{background:var(--tag-blue-bg);color:var(--tag-blue)}
.tag .d{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.h2{font-size:14px;font-weight:600;margin:8px 0 2px;display:flex;align-items:center;gap:8px}
.h2 .cnt{color:var(--faint);font-weight:500;font-size:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.tiny{font-size:12px;color:var(--faint)}
.todo{display:flex;flex-direction:column;gap:1px}
.todo-item{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:4px}
.todo-item:hover{background:var(--hover)}
.todo-item input[type=checkbox]{width:16px;height:16px;margin:3px 0 0;accent-color:var(--red);flex:none}
.todo-item .t{flex:1;min-width:0}
.todo-item .t b{font-weight:500;display:block;overflow-wrap:anywhere;font-size:13px}
.todo-item .t small{color:var(--faint);font-size:12px}
.todo-item.done .t b{text-decoration:line-through;color:var(--faint)}
.todo-item .x{opacity:0}
.todo-item:hover .x{opacity:1}
.addline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:2px 0}
.addline input[type=text]{flex:1;min-width:110px}
input[type=text],input[type=date],input[type=email],select,textarea{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:6px 9px;min-width:0}
input[type=text]::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.grow{flex:1}
.empty{padding:10px;color:var(--faint);font-size:12.5px;border:1px dashed var(--line-2);border-radius:6px;text-align:center}
.comments{display:flex;flex-direction:column;gap:9px;max-height:220px;overflow:auto;padding:2px 0}
.cmt{display:flex;gap:8px;align-items:flex-start}
.cmt .body{min-width:0;flex:1}
.cmt .who{font-size:12px;display:flex;gap:6px;align-items:baseline}
.cmt .who b{font-weight:600}
.cmt .who span{color:var(--faint)}
.cmt .txt{overflow-wrap:anywhere;margin-top:1px;font-size:13px}
.composer{display:flex;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:6px;padding:4px 4px 4px 9px;background:#fff}
.composer input{border:0;background:transparent;padding:4px 0;flex:1}
.composer input:focus-visible{outline:0}

/* ---------- overlays (projects / team) ---------- */
dialog{border:0;border-radius:10px;padding:0;background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--shadow);width:100%}
dialog::backdrop{background:rgba(25,23,20,.5)}
dialog.wide{max-width:min(95vw,960px)}
dialog.slim{max-width:min(92vw,460px)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:84vh;overflow:auto}
.dlg h2{font-size:18px;display:flex;align-items:center;gap:8px}
.dlg h2 .sp{flex:1}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick .btn{justify-content:flex-start;box-shadow:none}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.dbwrap{overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.db{border-collapse:collapse;width:100%;min-width:700px;font-size:13.5px}
table.db th{font-weight:500;color:var(--faint);font-size:12px;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
table.db th:last-child,table.db td:last-child{border-right:0}
table.db td{padding:6px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
table.db tr.rowp{cursor:pointer}
table.db tr.rowp:hover td{background:var(--hover)}
table.db tr.open td{background:var(--paper)}
table.db td.name{font-weight:500}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--red)}
.avatars{display:inline-flex;align-items:center;gap:4px}
.proj-detail{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--card)}
.new-row{display:flex;gap:6px;align-items:center;padding:8px 4px;color:var(--faint);font-size:13px;border:0;background:transparent;cursor:pointer;width:100%;text-align:left;border-radius:6px}
.new-row:hover{background:var(--hover);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 13px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow);z-index:40}
.toast.show{opacity:1}
</style>

<div class="stage" id="stage">
  <svg id="office" viewBox="0 0 1000 566" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hand-drawn map of the Experiment Events office"></svg>
  <div class="float-card hidden" id="floatCard"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header class="hud hud-tl">
  <div class="brand"><img id="logoImg" alt="Experiment Events"><small>Live office</small></div>
</header>
<div class="hud hud-tr">
  <button class="pill btnish" id="pillCounts"><span class="d" style="background:var(--red)"></span><span id="countsTxt">0 working</span></button>
  <button class="pill btnish" id="btnProjects"><svg class="ni" viewBox="0 0 16 16"><rect x="3" y="2.5" width="10" height="11" rx="1.5"/><path d="M5.5 6.2h5M5.5 8.7h5M5.5 11.2h3"/></svg> Projects <span class="faint" id="cntProjects">0</span></button>
  <button class="pill btnish" id="btnTeam"><svg class="ni" viewBox="0 0 16 16"><circle cx="6" cy="5.6" r="2.1"/><path d="M2.6 13.4c.3-2.4 1.7-3.6 3.4-3.6s3.1 1.2 3.4 3.6M11.3 8.1a1.9 1.9 0 1 0-.1-3.8M10.9 10.2c1.9.1 3 1.2 3.3 3.2"/></svg> Team</button>
  <span class="pill" id="pillSync"><span class="d"></span><span>Connecting…</span></span>
</div>
<div class="hud hud-bl">
  <div class="legend">
    <span><i style="background:var(--red)"></i>Working</span>
    <span><i style="background:#C9C7C1"></i>Away</span>
    <span><i style="background:#fff;border:1.5px solid #C9C7C1;width:7px;height:7px"></i>Offline</span>
  </div>
</div>
<div class="hud hud-br">
  <div class="me-chip"><div class="sk-av sm" id="meAv">?</div><div id="meWho">Not checked in</div></div>
  <button class="btn sm" id="btnIdentify">Who are you?</button>
  <button class="btn sm primary hidden" id="btnCheckIn">Check in</button>
  <button class="btn sm hidden" id="btnCheckOut">Check out</button>
</div>

<aside class="rail" aria-label="Projects">
  <div class="rail-head"><b><svg class="ni" viewBox="0 0 16 16"><rect x="3" y="2.5" width="10" height="11" rx="1.5"/><path d="M5.5 6.2h5M5.5 8.7h5M5.5 11.2h3"/></svg> Projects</b><span class="tiny" id="railCount"></span><span style="flex:1"></span><button class="btn sm" id="railNew">＋ New</button></div>
  <div class="rail-body" id="railBody"><div class="empty">Loading…</div></div>
</aside>

<dialog id="dlgIdentify" class="slim">
  <form method="dialog" class="dlg">
    <h2>Who are you?</h2>
    <p class="muted" style="margin:0">Pick your name so you appear at your desk and can chat. Remembered on this device.</p>
    <div class="pick" id="pickList"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" value="cancel">Just visiting</button></div>
  </form>
</dialog>

<dialog id="dlgBoard" class="wide">
  <div class="dlg">
    <h2><svg class="ni" viewBox="0 0 16 16"><rect x="3" y="2.5" width="10" height="11" rx="1.5"/><path d="M5.5 6.2h5M5.5 8.7h5M5.5 11.2h3"/></svg> Projects <span class="sp"></span><button class="btn sm" id="newProject">＋ New</button><button class="btn sm ghost" data-close="dlgBoard">✕</button></h2>
    <div id="boardBody"></div>
  </div>
</dialog>

<dialog id="dlgTeam" class="wide">
  <div class="dlg">
    <h2><svg class="ni" viewBox="0 0 16 16"><circle cx="6" cy="5.6" r="2.1"/><path d="M2.6 13.4c.3-2.4 1.7-3.6 3.4-3.6s3.1 1.2 3.4 3.6M11.3 8.1a1.9 1.9 0 1 0-.1-3.8M10.9 10.2c1.9.1 3 1.2 3.3 3.2"/></svg> Team <span class="sp"></span><button class="btn sm ghost" data-close="dlgTeam">✕</button></h2>
    <div id="teamBody"></div>
  </div>
</dialog>

<dialog id="dlgProject" class="slim">
  <form class="dlg" id="formProject">
    <h2 id="projFormTitle">New project</h2>
    <div class="field"><label for="pName">Name</label><input id="pName" type="text" required maxlength="80" placeholder="Untitled"></div>
    <div class="row">
      <div class="field grow"><label for="pClient">Client</label><input id="pClient" type="text" maxlength="60"></div>
      <div class="field grow"><label for="pDeadline">Event / deadline</label><input id="pDeadline" type="date"></div>
    </div>
    <div class="row">
      <div class="field grow"><label for="pOwner">Lead</label><select id="pOwner"></select></div>
      <div class="field grow"><label for="pStatus">Status</label><select id="pStatus"><option value="planning">Planning</option><option value="active" selected>Active</option><option value="on-hold">On hold</option><option value="done">Done</option></select></div>
    </div>
    <div class="field"><label for="pNotes">Brief / notes</label><textarea id="pNotes" maxlength="1500"></textarea></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" id="projCancel">Cancel</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

const ENTRANCE = {x:415,y:95};
const HUB = {x:490,y:170};
const WOOD_GATE = {x:520,y:290};
const GM_DOOR_OUT = {x:598,y:345};
const GM_DOOR_IN = {x:655,y:340};
const inGM = p => p.x>620 && p.y>230;
const inCorridor = p => p.y<270 && p.x>330;
function seatOf(desk){ return SEATS[desk] || HUB; }
function approachOf(desk){
  const s=seatOf(desk);
  if(desk==='GM') return {x:s.x-60,y:s.y+34};
  if(s.tag==='left') return {x:s.x-42,y:s.y+4};
  if(s.tag==='right') return {x:s.x+42,y:s.y+4};
  if(s.tag==='top') return {x:s.x,y:s.y-48};
  return {x:s.x,y:s.y+48};
}
function routeTo(from, target){
  const path=[];
  if(inGM(from)!==inGM(target)){
    if(inGM(from)){ path.push(GM_DOOR_IN, GM_DOOR_OUT); if(inCorridor(target)) path.push(WOOD_GATE, HUB); }
    else { if(inCorridor(from)) path.push(HUB, WOOD_GATE); path.push(GM_DOOR_OUT, GM_DOOR_IN); }
  } else if(inCorridor(from)!==inCorridor(target)){
    path.push(inCorridor(from)? HUB : WOOD_GATE, inCorridor(from)? WOOD_GATE : HUB);
  }
  path.push(target); return path;
}

const $ = (s,el=document)=>el.querySelector(s);

const initials = n => (n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const ls = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };
function teamList(){ return ROSTER.map(r=>Object.assign({}, r, S.team[r.id]||{}, {id:r.id, desk:r.desk})); }
function emp(id){ return teamList().find(e=>e.id===id); }
function statusOf(id){
  const p=S.presence[id]; if(!p||!p.status||p.status==='offline') return 'offline';
  const age = Date.now() - Date.parse(p.at||0);
  if(isNaN(age) || age > 10*3600e3) return 'offline';
  return p.status==='away' ? 'away' : 'working';
}
function since(iso){ const t=Date.parse(iso); if(isNaN(t)) return ''; const m=Math.max(0,Math.round((Date.now()-t)/60000)); if(m<1) return 'just now'; if(m<60) return m+' min'; const h=Math.floor(m/60); return h+'h '+(m%60)+'m'; }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+(iso.length===10?'T12:00:00':'')); return isNaN(d)?iso:d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function daysLeft(iso){ if(!iso) return null; return Math.ceil((Date.parse(iso+'T12:00:00')-Date.now())/864e5); }
function dl(iso){ const d=daysLeft(iso); if(d===null) return ''; return d<0? Math.abs(d)+'d overdue' : d===0?'today': d+'d left'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

function placeWalker(){
  const w=$('#walker'); if(!w) return;
  w.setAttribute('transform',`translate(${S.walker.x.toFixed(1)},${S.walker.y.toFixed(1)})`);
  const c=w.querySelector('.char'); if(c) c.setAttribute('transform',`scale(${.95*S.walker.facing},.95)`);
  const t=w.querySelector('text'); if(t) t.setAttribute('transform',`scale(${S.walker.facing},1)`);
}
function walkTo(target, done){
  const wk=S.walker; const from={x:wk.x,y:wk.y}; const w=$('#walker'); if(!w){ wk.x=target.x; wk.y=target.y; done&&done(); return; }
  wk.path=routeTo(from,target); wk.moving=true; w.classList.remove('idle');
  const speed=200; let last=performance.now();
  function step(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    const p=wk.path[0]; if(!p){ wk.moving=false; const w2=$('#walker'); if(w2) w2.classList.add('idle'); placeWalker(); publishPresence(true); done&&done(); return; }
    const dx=p.x-wk.x, dy=p.y-wk.y, dist=Math.hypot(dx,dy);
    if(dist<3){ wk.x=p.x; wk.y=p.y; wk.path.shift(); } else { const m=Math.min(dist,speed*dt); wk.x+=dx/dist*m; wk.y+=dy/dist*m; wk.facing = dx<0?-1:1; }
    placeWalker(); publishPresence(); requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

async function writePresence(status, note){
  if(!S.db||!S.me) return toast('Pick who you are first');
  const cur=S.presence[S.me]||{};
  const body={status, at:new Date().toISOString(), by:S.uid||null, note: note!==undefined?note:(cur.note||'')};
  if(status==='working' && cur.status==='working') body.startedAt = cur.startedAt||cur.at; else if(status==='working') body.startedAt=body.at; else body.startedAt=cur.startedAt||null;
  try{ await S.db.doc('presence/'+S.me).set(body); }
  catch(e){ if(e&&e.code==='invalid_argument'){ S.canWrite=false; toast('You can view this office but not check in (view-only access)'); } else toast('Could not save — try again'); }
}

    </div>
    <div class="h2">Action plan <span class="cnt">${steps.filter(s=>s.done).length}/${steps.length}</span></div>
    <div class="todo">${steps.length? steps.map(s=>{ const o=all.find(e=>e.id===s.owner); return `<label class="todo-item ${s.done?'done':''}"><input type="checkbox" data-toggle="${esc(pr.id)}|${esc(s.id)}" ${s.done?'checked':''}><div class="t"><b>${esc(s.title)}</b><small>${o?esc(o.name):'unassigned'}${s.due?' · '+fmtDate(s.due)+' · '+dl(s.due):''}</small></div><button class="btn sm ghost x" type="button" data-delstep="${esc(pr.id)}|${esc(s.id)}" aria-label="Remove step">✕</button></label>`; }).join('') : '<div class="empty">No steps yet — add the first one</div>'}</div>
    <form class="addline" data-addstep="${esc(pr.id)}"><span class="faint">＋</span><input type="text" placeholder="New step" maxlength="140" required name="title"><select name="owner" style="width:auto"><option value="">Owner</option>${all.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><input type="date" name="due" style="width:auto"><button class="btn sm" type="submit">Add</button></form>
  </div>`;
}
function renderTeamDlg(){
  const all=teamList();
  $('#teamBody').innerHTML = `<div class="dbwrap"><table class="db">
     <thead><tr><th>Aa Name</th><th>◫ Desk</th><th>≡ Role</th><th>◔ Status</th><th>✎ Working on</th><th>@ Email</th><th></th></tr></thead>
     <tbody>${all.map(e=>{ const st=statusOf(e.id); const p=S.presence[e.id]||{}; return `<tr><td class="name"><span class="avatars">${avHTML(e,st,'sm')}${esc(e.name)}</span></td><td><span class="tag">${esc(e.desk)}</span></td><td>${esc(e.role||'Team')}</td><td>${STATUS_TAG[st]}</td><td class="faint">${esc(p.note||'')}</td><td class="faint">${esc(e.email||'')}</td><td><span class="row">${S.canEdit?`<button class="btn sm ghost" data-editemp="${e.id}">Edit</button>`:''}<button class="btn sm" data-visit="${e.id}">Visit</button></span></td></tr>`; }).join('')}</tbody>
   </table></div>
   ${S.canEdit? `<div class="proj-detail hidden" id="empEditor"></div>`:''}`;
  bindCommon($('#teamBody'));
}
function bindCommon(p){
  const sw=p.querySelector('#switchEmp'); if(sw) sw.addEventListener('change',()=>visit(sw.value));
  p.querySelectorAll('[data-closecard]').forEach(b=>b.addEventListener('click',closeCard));
  p.querySelectorAll('[data-visit]').forEach(b=>b.addEventListener('click',()=>{ $('#dlgTeam').close(); visit(b.dataset.visit); }));
  p.querySelectorAll('[data-openproj]').forEach(b=>b.addEventListener('click',()=>{ S.openProj=b.dataset.openproj; renderBoard(); $('#dlgBoard').showModal(); }));
  p.querySelectorAll('[data-row]').forEach(r=>r.addEventListener('click',ev=>{ if(ev.target.closest('button,select,input,label')) return; S.openProj = S.openProj===r.dataset.row ? null : r.dataset.row; renderBoard(); }));
  p.querySelectorAll('[data-toggle]').forEach(c=>c.addEventListener('change',()=>toggleStep(c.dataset.toggle, c.checked)));
  p.querySelectorAll('[data-delstep]').forEach(b=>b.addEventListener('click',()=>delStep(b.dataset.delstep)));
  p.querySelectorAll('[data-addstep]').forEach(f=>f.addEventListener('submit',ev=>{ ev.preventDefault(); addStep(f.dataset.addstep, f.title.value, f.owner.value, f.due.value); f.reset(); }));
  p.querySelectorAll('[data-status]').forEach(s=>s.addEventListener('change',()=>saveProject(s.dataset.status,{status:s.value})));
  p.querySelectorAll('[data-editproj]').forEach(b=>b.addEventListener('click',()=>openProjectForm(b.dataset.editproj)));
  p.querySelectorAll('[data-delproj]').forEach(b=>b.addEventListener('click',async()=>{ const pr=S.projects[b.dataset.delproj]; if(!pr||!confirm('Delete "'+pr.name+'" and its action plan?')) return; try{ await S.db.doc('projects/'+pr.id).delete(); toast('Project deleted'); }catch(e){ toast('Could not delete'); } }));
  const sn=p.querySelector('#saveNote'); if(sn) sn.addEventListener('click',async()=>{ const v=$('#noteInput').value.trim(); const st=statusOf(S.me); await writePresence(st==='offline'?'working':st, v); toast('Saved'); });
  const ai=p.querySelector('#addItem'); if(ai) ai.addEventListener('submit',ev=>{ ev.preventDefault(); const pid=$('#newItemProject').value; if(!pid) return toast('Create a project first (Projects)'); addStep(pid, $('#newItemTitle').value, S.selected, ''); ai.reset(); });
  const comp=p.querySelector('#composer'); if(comp) comp.addEventListener('submit',ev=>{ ev.preventDefault(); const i=$('#msgInput'); const t=i.value.trim(); if(!t) return; i.value=''; sendMsg(t); });
  p.querySelectorAll('[data-editemp]').forEach(b=>b.addEventListener('click',()=>{ const e=emp(b.dataset.editemp); const ed=$('#empEditor'); ed.classList.remove('hidden'); ed.innerHTML=`<h2 style="font-size:15px">Edit ${esc(e.name)}</h2><div class="row" style="margin-top:8px"><div class="field grow"><label for="edRole">Role</label><input id="edRole" type="text" value="${esc(e.role||'')}" maxlength="60"></div><div class="field grow"><label for="edEmail">Work email</label><input id="edEmail" type="email" value="${esc(e.email||'')}" maxlength="120"></div></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sm ghost" id="edCancel">Cancel</button><button class="btn sm primary" id="edSave">Save</button></div>`; ed.scrollIntoView({block:'nearest'});
    $('#edCancel').addEventListener('click',()=>ed.classList.add('hidden'));
    $('#edSave').addEventListener('click',async()=>{ try{ await S.db.doc('team/'+e.id).set({name:e.name, desk:e.desk, role:$('#edRole').value.trim(), email:$('#edEmail').value.trim().toLowerCase()}); toast('Saved'); }catch(err){ toast('Could not save'); } }); }));
}

/* ---------- projects CRUD ---------- */
function newId(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function openProjectForm(id){
  const f=$('#formProject'); f.dataset.id=id||''; $('#projFormTitle').textContent = id?'Edit project':'New project';
  $('#pOwner').innerHTML = '<option value="">—</option>'+teamList().map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  const pr = id? S.projects[id] : null;
  $('#pName').value=pr?pr.name:''; $('#pClient').value=pr?(pr.client||''):''; $('#pDeadline').value=pr?(pr.deadline||''):''; $('#pOwner').value=pr?(pr.owner||''):(S.me||''); $('#pStatus').value=pr?pr.status:'active'; $('#pNotes').value=pr?(pr.notes||''):'';
  $('#dlgProject').showModal();
}
$('#newProject').addEventListener('click',()=>openProjectForm(null));
$('#railNew').addEventListener('click',()=>openProjectForm(null));
$('#projCancel').addEventListener('click',()=>$('#dlgProject').close());
$('#formProject').addEventListener('submit',async ev=>{
  ev.preventDefault(); const f=ev.target; const id=f.dataset.id||newId(); const pr=S.projects[id]||{id, steps:[], createdAt:new Date().toISOString()};
  const body=Object.assign({},pr,{id, name:$('#pName').value.trim()||'Untitled', client:$('#pClient').value.trim(), deadline:$('#pDeadline').value, owner:$('#pOwner').value, status:$('#pStatus').value, notes:$('#pNotes').value.trim(), updatedAt:new Date().toISOString()});
  if(!S.db) return toast('Not connected');
  try{ await S.db.doc('projects/'+id).set(body); $('#dlgProject').close(); S.openProj=id; toast('Saved'); }
  catch(e){ toast(e&&e.code==='invalid_argument'?'You have view-only access':'Could not save'); }
});
async function saveProject(id, patch){ const pr=S.projects[id]; if(!pr||!S.db) return; try{ await S.db.doc('projects/'+id).set(Object.assign({},pr,patch,{updatedAt:new Date().toISOString()})); }catch(e){ toast('Could not save'); } }
async function addStep(pid, title, owner, due){ const pr=S.projects[pid]; title=(title||'').trim(); if(!pr||!title) return; const steps=(pr.steps||[]).concat([{id:'s'+Date.now().toString(36), title, owner:owner||'', due:due||'', done:false, createdAt:new Date().toISOString()}]); await saveProject(pid,{steps}); toast('Step added'); }
async function toggleStep(key, done){ const [pid,sid]=key.split('|'); const pr=S.projects[pid]; if(!pr) return; const steps=(pr.steps||[]).map(s=>s.id===sid?Object.assign({},s,{done, doneAt: done?new Date().toISOString():null, doneBy: done?(S.me||S.uid||null):null}):s); await saveProject(pid,{steps}); }
async function delStep(key){ const [pid,sid]=key.split('|'); const pr=S.projects[pid]; if(!pr) return; await saveProject(pid,{steps:(pr.steps||[]).filter(s=>s.id!==sid)}); }

/* ---------- chat ---------- */
function chatKey(a,b){ return [a,b].sort().join('__'); }
function openChat(otherId){
  closeChat(); if(!S.db||!S.me) return;
  const key=chatKey(S.me, otherId); S.chat.key=key; S.chat.msgs=[];
  S.chat.unsub = S.db.doc('chats/'+key).onSnapshot(snap=>{ S.chat.msgs = snap.exists ? (snap.data().messages||[]) : []; renderMsgs(); }, ()=>{ const cs=$('#chatState'); if(cs) cs.textContent='chat unavailable'; });
}
function closeChat(){ if(S.chat.unsub){ S.chat.unsub(); S.chat.unsub=null; } S.chat.key=null; S.chat.msgs=[]; }
function renderMsgs(){
  const box=$('#msgs'); if(!box) return; box.innerHTML='';
  if(!S.me) return;
  if(!S.chat.msgs.length){ box.innerHTML='<div class="empty">No messages yet</div>'; return; }
  S.chat.msgs.slice(-80).forEach(m=>{ const d=document.createElement('div'); d.className='cmt'+(m.from===S.me?' mine':''); const who=emp(m.from)||{name:'?'}; d.innerHTML=`${avHTML(who,statusOf(m.from),'sm')}<div class="body"><div class="who"><b>${esc(who.name)}</b><span>${new Date(m.at).toLocaleString(undefined,{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</span></div><div class="txt">${esc(m.text)}</div></div>`; box.appendChild(d); });
  box.scrollTop=box.scrollHeight;
}
let sending=false;
async function sendMsg(text){
  if(!S.db||!S.chat.key||sending) return; sending=true;
  try{ const ref=S.db.doc('chats/'+S.chat.key); const snap=await ref.get(); const msgs=(snap.exists?(snap.data().messages||[]):[]).slice(-299); msgs.push({from:S.me, text:text.slice(0,600), at:new Date().toISOString()}); await ref.set({messages:msgs, updatedAt:new Date().toISOString(), members:S.chat.key.split('__')}); }
  catch(e){ toast(e&&e.code==='invalid_argument'?'You have view-only access':'Message not sent — try again'); }
  sending=false;
}

/* ===================== boot ===================== */
setInterval(()=>{ updateOffice(); renderMeBar(); }, 60e3);
buildOffice(); renderMeBar(); renderRail();
const remembered=ls.get('ee.me'); if(remembered && ROSTER.some(r=>r.id===remembered)) setMe(remembered,false);

function boot(){
  const sync=$('#pillSync');
  if(!window.firebase || !CONFIG.firebase.projectId){ sync.lastElementChild.textContent='Not configured \u2014 see README-SETUP'; return; }
  firebase.initializeApp(CONFIG.firebase);
  const fdb=firebase.firestore();
  S.db=fdb; S.room=null; S.user=null; S.canEdit=true; S.canWrite=true;
  let uid=ls.get('ee.uid'); if(!uid){ uid='u'+Math.random().toString(36).slice(2,12); ls.set('ee.uid',uid); }
  S.uid=uid;
  sync.lastElementChild.textContent='Live'; sync.classList.add('live');
  const refreshOpen=()=>{ renderRail(); const c=$('#floatCard'); if(!c.classList.contains('hidden')&&c.dataset.emp) showCard(c.dataset.emp); if($('#dlgBoard').open) renderBoard(); if($('#dlgTeam').open) renderTeamDlg(); };
  fdb.collection('team').onSnapshot(snap=>{ S.team={}; snap.docs.forEach(d=>{ S.team[d.id]=d.data(); }); refreshOpen(); },()=>{});
  fdb.collection('presence').onSnapshot(snap=>{ S.presence={}; snap.docs.forEach(d=>{ S.presence[d.id]=d.data(); }); updateOffice(); renderMeBar(); refreshOpen(); },()=>{});
  fdb.collection('projects').onSnapshot(snap=>{ S.projects={}; snap.docs.forEach(d=>{ S.projects[d.id]=d.data(); }); $('#cntProjects').textContent=Object.values(S.projects).filter(x=>x.status!=='done').length; refreshOpen(); maybeOfferSeed(); },()=>{ sync.lastElementChild.textContent='Database error \u2014 check Firestore rules'; });
  fdb.doc('data/users/'+uid+'/profile').get().then(snap=>{ if(!S.me && snap.exists && snap.data().empId && ROSTER.some(r=>r.id===snap.data().empId)) setMe(snap.data().empId); }).catch(()=>{});
  if(!S.me && !ls.get('ee.me')) setTimeout(()=>{ if(!S.me) openIdentify(); }, 900);
}
(async function gate(){
  let ok=!CONFIG.accessCodeHash;
  if(!ok){ try{ ok=localStorage.getItem('ee.code')===CONFIG.accessCodeHash; }catch(e){} }
  if(ok){ boot(); return; }
  async function sha(t){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
  const ov=document.createElement('div');
  Object.assign(ov.style,{position:'fixed',inset:'0',zIndex:'99',background:'var(--paper)',display:'grid',placeItems:'center'});
  ov.innerHTML='<div class="gate-card"><img src="'+LOGO_IMG+'" alt="Experiment Events" style="height:40px"><h2>Team access</h2><p class="muted" style="margin:0">Enter the office access code to come in.</p><form id="gateForm"><input type="password" id="gateCode" placeholder="Access code" autocomplete="off"><button class="btn primary" type="submit">Enter</button></form><p id="gateErr" class="tiny" style="color:var(--red);margin:0"></p></div>';
  document.body.appendChild(ov);
  ov.querySelector('#gateForm').addEventListener('submit',async ev=>{
    ev.preventDefault(); const v=ov.querySelector('#gateCode').value; const hv=await sha(v);
    if(hv===CONFIG.accessCodeHash){ ls.set('ee.code',hv); ov.remove(); boot(); }
    else{ ov.querySelector('#gateErr').textContent='Wrong code \u2014 try again'; ov.querySelector('#gateCode').select(); }
  });
  ov.querySelector('#gateCode').focus();
})();
let seeded=false;
function maybeOfferSeed(){
  const head=document.querySelector('.rail-head'); if(!head) return;
  let b=$('#seedBtn');
  const empty=Object.keys(S.projects).length===0;
  if(empty && Array.isArray(window.SEED_PROJECTS) && SEED_PROJECTS.length && !seeded){
    if(!b){ b=document.createElement('button'); b.id='seedBtn'; b.className='btn sm primary'; b.textContent='Import tracker ('+SEED_PROJECTS.length+')';
      b.addEventListener('click',async()=>{ if(seeded) return; seeded=true; b.disabled=true; let n=0;
        for(const p of SEED_PROJECTS){ try{ await S.db.doc('projects/'+p.id).set(p); n++; if(n%20===0) toast('Imported '+n+'\u2026'); }catch(e){ toast('Import stopped \u2014 check Firestore rules'); seeded=false; b.disabled=false; return; } }
        toast('Imported '+n+' projects'); b.remove(); });
      head.insertBefore(b, document.getElementById('railNew')); }
  } else if(b) b.remove();
}
</script>
